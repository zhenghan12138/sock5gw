[Unit]
Requires=sock5gw-nftables-validate.service sock5gw-nftables.service
After=sock5gw-nftables-validate.service sock5gw-nftables.service

[Service]
# The validator is intentionally inactive after each successful run, so
# systemd reruns its isolated namespace check before every sock5gw start.
ExecStartPre=/usr/local/libexec/sock5gw-nftables-apply /etc/sock5gw/nftables.nft /etc/sock5gw/config.json
RestartPreventExitStatus=78
